{% extends "base.html" %}
{% block title %}Register — AttendAI{% endblock %}
{% block content %}
<div class="auth-wrapper">
  <div class="card auth-card p-4">
    <div class="text-center mb-3">
      <i class="bi bi-person-plus-fill text-primary" style="font-size: 2.5rem;"></i>
      <h4 class="mt-2 mb-0">Teacher Registration</h4>
    </div>
    <form method="POST">
      <div class="mb-3">
        <label class="form-label">Full Name</label>
        <input type="text" name="name" class="form-control" required autofocus>
      </div>
      <div class="mb-3">
        <label class="form-label">Username</label>
        <input type="text" name="username" class="form-control" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Password</label>
        <input type="password" name="password" class="form-control" required>
      </div>
      <button type="submit" class="btn btn-primary w-100">Create Account</button>
    </form>
    <div class="text-center mt-3">
      <small>Already have an account? <a href="{{ url_for('auth.login') }}">Login</a></small>
    </div>
  </div>
</div>
{% endblock %}
