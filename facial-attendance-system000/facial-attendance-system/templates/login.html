{% extends "base.html" %}
{% block title %}Login — AttendAI{% endblock %}
{% block content %}
<div class="auth-wrapper">
  <div class="card auth-card p-4">
    <div class="text-center mb-3">
      <i class="bi bi-camera-video-fill text-primary" style="font-size: 2.5rem;"></i>
      <h4 class="mt-2 mb-0">Teacher Login</h4>
      <small class="text-muted">College Classroom Facial Recognition Attendance System</small>
    </div>
    <form method="POST">
      <div class="mb-3">
        <label class="form-label">Username</label>
        <input type="text" name="username" class="form-control" required autofocus>
      </div>
      <div class="mb-3">
        <label class="form-label">Password</label>
        <input type="password" name="password" class="form-control" required>
      </div>
      <button type="submit" class="btn btn-primary w-100">Login</button>
    </form>
    <div class="text-center mt-3">
      <small>No account? <a href="{{ url_for('auth.register') }}">Register as teacher</a></small>
    </div>
  </div>
</div>
{% endblock %}
