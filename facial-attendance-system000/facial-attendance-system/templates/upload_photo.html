{% extends "base.html" %}
{% block title %}Take Attendance{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card p-4">
      <h4 class="mb-3"><i class="bi bi-camera-fill me-2"></i>Take Attendance — {{ cls.display_name }}</h4>
      <p class="text-muted">Upload a classroom photo. The Face Recognition Engine will detect and match faces against registered students.</p>
      <form method="POST" enctype="multipart/form-data">
        <div class="mb-3">
          <label class="form-label">Session Date</label>
          <input type="date" name="session_date" class="form-control" value="{{ today or '' }}" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Classroom Photo</label>
          <input type="file" name="classroom_photo" class="form-control" accept="image/*" required>
        </div>
        <button type="submit" class="btn btn-primary">
          <i class="bi bi-search me-1"></i> Detect &amp; Recognize Faces
        </button>
        <a href="{{ url_for('classes.class_detail', class_id=cls.id) }}" class="btn btn-link">Cancel</a>
      </form>
    </div>
  </div>
</div>
{% endblock %}
